<html lang="ru"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>RNDM Speed Test</title><style>body{font-family:system-ui;background:#0c0d12;color:#fff;margin:0;padding:28px}.card{max-width:720px;margin:auto;background:#171923;border:1px solid #2b2e3d;border-radius:20px;padding:22px}button{background:#7c5cff;color:white;border:0;border-radius:12px;padding:12px 18px;font-weight:700}.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid #2b2e3d}.ok{color:#57e6a7}.bad{color:#ff6b80}</style><link href="manifest.webmanifest" rel="manifest"/><link href="rndm-v26.css?v=27.6" rel="stylesheet"/><link href="rndm-shell.css?v=27.6" rel="stylesheet"/><link rel="preconnect" href="https://rijqlmrcnshswtoweoai.supabase.co" crossorigin/><link rel="dns-prefetch" href="//rijqlmrcnshswtoweoai.supabase.co"/><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/><link rel="stylesheet" href="rndm-v27.css?v=27.6"></head><body><header class="rndm-unified-header" id="rndmUnifiedHeader">

</header><div class="card"><h1>⚡ RNDM Speed Test</h1><p>Проверка фактической задержки Supabase.</p><button id="run">Запустить тест</button><div id="out"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="rndm-cloud.js?v=27.6"></script><script src="rndm-censor.js?v=27.6"></script><script>const out=document.querySelector('#out');async function one(name,fn){const t=performance.now();try{await fn();const ms=Math.round(performance.now()-t);return `<div class="row"><b>${name}</b><span class="${ms<1500?'ok':'bad'}">${ms} ms</span></div>`}catch(e){return `<div class="row"><b>${name}</b><span class="bad">${e.message||e}</span></div>`}}document.querySelector('#run').onclick=async()=>{const sb=RNDMCloud.getClient();out.innerHTML='Тест…';let html='';html+=await one('Локальная сессия',()=>RNDMCloud.session(true));const u=await RNDMCloud.user();html+=await one('profiles',()=>sb.from('profiles').select('id').limit(1));html+=await one('messages',()=>sb.from('messages').select('id').limit(1));if(u)html+=await one('user_state одним запросом',()=>sb.from('user_state').select('key').eq('user_id',u.id).limit(50));out.innerHTML=html}</script><script src="rndm-v26.js?v=27.6"></script><script src="rndm-v26-extra.js?v=27.6"></script><script src="rndm-shell.js?v=27.6"></script><script src="rndm-performance.js?v=27.6"></script><script src="rndm-profiles.js?v=27.6"></script><script src="rndm-v27.js?v=27.6"></script><script src="rndm-repair-v276.js?v=27.6"></script></body></html>
