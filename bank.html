<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>RNDM Банк</title><style>
:root{--bg:#090a11;--panel:#151925;--line:#ffffff16;--text:#f7f8ff;--muted:#9ca5b8;--green:#27e6a4;--purple:#7c5cff;--danger:#ff5a75}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#17423255,transparent 30%),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:90px}a{color:inherit;text-decoration:none}.top{position:sticky;top:0;z-index:10;padding:14px 20px;display:flex;align-items:center;gap:12px;background:#090a11e8;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--purple),var(--green));font-weight:900}.top b{font-size:20px}.top nav{margin-left:auto;display:flex;gap:10px}.top nav a{color:var(--muted)}.page{max-width:1000px;margin:auto;padding:30px 20px}.warning{padding:13px 15px;background:#ffb34714;border:1px solid #ffb34740;border-radius:16px;color:#ffd18d}.balance{margin:20px 0;padding:26px;border-radius:28px;background:linear-gradient(135deg,#245846,#263471);box-shadow:0 30px 70px #0004}.balance small{opacity:.75}.balance strong{display:block;font-size:44px;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px}.card h2{margin-top:0}.field{width:100%;padding:13px;border-radius:14px;border:1px solid var(--line);background:#0e1119;color:white;margin:6px 0}.btn{border:0;border-radius:14px;padding:12px 15px;background:#ffffff0d;color:white;font-weight:800;cursor:pointer}.btn.primary{background:linear-gradient(135deg,var(--green),#79ff77);color:#082117}.loan{padding:14px;border-radius:16px;background:#ffffff07;margin:10px 0}.loan-head{display:flex;justify-content:space-between;gap:10px}.loan small,.muted{color:var(--muted)}.progress{height:7px;border-radius:99px;background:#ffffff0d;overflow:hidden;margin:10px 0}.progress i{height:100%;display:block;background:var(--green)}.calc{font-size:14px;color:var(--muted);line-height:1.5}.mobile{display:none}@media(max-width:760px){.top nav{display:none}.top{padding-top:calc(10px + env(safe-area-inset-top))}.page{padding:20px 14px}.grid{grid-template-columns:1fr}.balance strong{font-size:36px}.mobile{position:fixed;display:grid;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;background:#10131df2;border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}.mobile a{text-align:center;font-size:11px;color:var(--muted)}.mobile span{display:block;font-size:22px}.mobile .active{color:white}}</style></head><body>
<header class="top"><a href="index.html" class="logo">R</a><b>RNDM Банк</b><nav><a href="market.html">Market</a><a href="estate.html">Квартиры</a><a href="profile.html">Профиль</a></nav></header><main class="page"><div class="warning">⚠️ Это только игровая экономика RNDM. Здесь нет реальных денег, банковских услуг или настоящих кредитов.</div><section class="balance"><small>Игровой баланс</small><strong id="balance">—</strong><div id="user">Загрузка…</div></section><div id="auth" class="card" style="display:none">Сначала <a href="profile.html" style="color:#7c5cff">войдите в аккаунт</a>.</div><div id="app" class="grid" style="display:none"><section class="card"><h2>Взять игровой кредит</h2><label>Сумма<input id="amount" class="field" type="number" min="10000" max="5000000" step="10000" value="500000"></label><label>Срок<select id="term" class="field"><option value="3">3 месяца — 5%</option><option value="6">6 месяцев — 8%</option><option value="12" selected>12 месяцев — 12%</option><option value="24">24 месяца — 18%</option></select></label><div class="calc" id="calc"></div><button class="btn primary" id="take">Получить на игровой баланс</button></section><section class="card"><h2>Мои кредиты</h2><div id="loans"></div></section></div></main><nav class="mobile"><a href="index.html"><span>⌂</span>Главная</a><a href="market.html"><span>🛍</span>Market</a><a class="active" href="bank.html"><span>💳</span>Банк</a><a href="estate.html"><span>🏠</span>Квартиры</a><a href="profile.html"><span>👤</span>Профиль</a></nav><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="rndm-cloud.js"></script><script>
(async()=>{const C=RNDMCloud,sb=C.getClient(),me=await C.user(),$=s=>document.querySelector(s);if(!me){$('#auth').style.display='block';return}$('#app').style.display='grid';const p=await C.profile(me.id);$('#user').textContent='@'+(p?.username||'user');function fmt(n){return new Intl.NumberFormat('ru-RU').format(Number(n||0))+' R₽'}function rate(){return {3:5,6:8,12:12,24:18}[Number($('#term').value)]||12}function calc(){let a=Number($('#amount').value||0),r=rate(),total=Math.round(a*(1+r/100)),m=Math.ceil(total/Number($('#term').value));$('#calc').innerHTML=`Игровая ставка: <b>${r}%</b><br>Вернуть всего: <b>${fmt(total)}</b><br>Условный платёж: <b>${fmt(m)}/мес.</b>`}$('#amount').oninput=calc;$('#term').onchange=calc;calc();async function load(){let [{data:w,error:we},{data:l,error:le}]=await Promise.all([sb.from('game_wallets').select('*').eq('user_id',me.id).maybeSingle(),sb.from('game_loans').select('*').eq('user_id',me.id).order('created_at',{ascending:false})]);if(we||le){$('#loans').innerHTML='<div class="muted">Сначала выполни supabase_v20_upgrade.sql</div>';return}$('#balance').textContent=fmt(w?.balance||0);$('#loans').innerHTML=(l||[]).length?(l||[]).map(x=>{let paid=x.total_due-x.remaining,pct=x.total_due?Math.round(paid/x.total_due*100):0;return `<div class="loan"><div class="loan-head"><b>${fmt(x.principal)}</b><span>${x.status==='paid'?'✅ Погашен':'🟢 Активен'}</span></div><small>${x.term_months} мес. • ${x.rate_percent}% • осталось ${fmt(x.remaining)}</small><div class="progress"><i style="width:${pct}%"></i></div>${x.status==='active'?`<button class="btn" data-pay="${x.id}" data-rem="${x.remaining}">Погасить</button>`:''}</div>`}).join(''):'<div class="muted">Активных кредитов нет.</div>';document.querySelectorAll('[data-pay]').forEach(b=>b.onclick=async()=>{let max=Number(b.dataset.rem),v=prompt('Сколько погасить?',String(Math.min(100000,max)));if(!v)return;const {error}=await sb.rpc('repay_demo_loan',{loan_id:b.dataset.pay,amount:Number(v)});if(error)alert(error.message);else load()})}$('#take').onclick=async()=>{let a=Number($('#amount').value),months=Number($('#term').value);if(!confirm(`Получить игровой кредит ${fmt(a)} на ${months} мес.?`))return;$('#take').disabled=true;const {error}=await sb.rpc('take_demo_loan',{amount:a,months});$('#take').disabled=false;if(error)alert(error.message);else{alert('Игровой кредит зачислен');load()}};load()})();
</script></body></html>
