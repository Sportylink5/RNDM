<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0f18"/>
<title>Новый пароль — RNDM</title>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="stylesheet" href="rndm-shell.css?v=27.1"/>
<link rel="stylesheet" href="rndm-v26.css?v=27.1"/>
<link rel="stylesheet" href="rndm-v27.css?v=27.1"/>
<style>
body{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 30% 0,#30235d55,transparent 42%),#080b14;color:#fff}
.reset-card{width:min(480px,100%);padding:26px;border-radius:28px;background:#111625;border:1px solid #ffffff18;box-shadow:0 24px 90px #0008}
.reset-logo{font-size:38px;font-weight:900;letter-spacing:-2px}.reset-sub{color:#9da7bd;margin:8px 0 22px}.reset-field{display:grid;gap:8px;margin:14px 0}.reset-field input{width:100%;box-sizing:border-box;padding:14px 16px;border-radius:14px;border:1px solid #ffffff20;background:#090d16;color:#fff;font-size:16px}.reset-btn{width:100%;padding:14px 16px;border:0;border-radius:15px;font-weight:800;font-size:16px;cursor:pointer;background:linear-gradient(135deg,#8067ff,#24d7ba);color:#081016;margin-top:8px}.reset-btn:disabled{opacity:.55}.reset-note{margin-top:14px;padding:12px 14px;border-radius:14px;background:#ffffff0b;color:#c8d0df}.reset-error{background:#ff46651a;color:#ff9cad}.reset-ok{background:#2dd4a51a;color:#7ff1cd}.reset-back{display:inline-block;margin-top:18px;color:#aeb8ff;text-decoration:none}
</style>
</head>
<body>
<main class="reset-card">
  <div class="reset-logo">RNDM</div>
  <div class="reset-sub">Восстановление доступа</div>
  <div id="loading" class="reset-note">Проверяю ссылку восстановления…</div>
  <form id="resetForm" style="display:none">
    <div class="reset-field"><label for="pass1">Новый пароль</label><input id="pass1" type="password" minlength="8" autocomplete="new-password" required placeholder="Минимум 8 символов"/></div>
    <div class="reset-field"><label for="pass2">Повтори пароль</label><input id="pass2" type="password" minlength="8" autocomplete="new-password" required placeholder="Ещё раз"/></div>
    <button class="reset-btn" id="saveBtn" type="submit">Сохранить новый пароль</button>
  </form>
  <div id="status"></div>
  <a class="reset-back" href="profile.html">← Вернуться в RNDM</a>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="rndm-cloud.js?v=27.1"></script>
<script>
(async()=>{
  const C=window.RNDMCloud, sb=C?.getClient?.(), loading=document.getElementById('loading'), form=document.getElementById('resetForm'), status=document.getElementById('status'), btn=document.getElementById('saveBtn');
  const say=(t,ok=false)=>{status.innerHTML='<div class="reset-note '+(ok?'reset-ok':'reset-error')+'">'+C.esc(t)+'</div>'};
  if(!sb){loading.textContent='Не удалось подключиться к RNDM.';return}
  let recovery=false;
  const open=()=>{recovery=true;loading.style.display='none';form.style.display='block'};
  sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'&&session)open()});
  const {data:{session}}=await sb.auth.getSession();
  const hash=new URLSearchParams(location.hash.replace(/^#/,''));
  const query=new URLSearchParams(location.search);
  if(session && (hash.get('type')==='recovery'||query.get('type')==='recovery'||sessionStorage.getItem('rndm-password-recovery')==='1')) open();
  if(!recovery){
    setTimeout(async()=>{
      const {data:{session:s}}=await sb.auth.getSession();
      if(s){open();return}
      loading.style.display='none';
      say('Ссылка недействительна или уже истекла. Запроси новое письмо восстановления в профиле RNDM.');
    },900);
  }
  form.addEventListener('submit',async e=>{
    e.preventDefault();const a=document.getElementById('pass1').value,b=document.getElementById('pass2').value;
    if(a.length<8)return say('Пароль должен содержать минимум 8 символов.');
    if(a!==b)return say('Пароли не совпадают.');
    btn.disabled=true;btn.textContent='Сохраняю…';
    const {error}=await sb.auth.updateUser({password:a});
    if(error){btn.disabled=false;btn.textContent='Сохранить новый пароль';return say(error.message)}
    try{sessionStorage.removeItem('rndm-password-recovery')}catch{}
    say('Пароль изменён. Сейчас верну тебя в RNDM ✓',true);
    setTimeout(()=>location.replace('profile.html'),900);
  });
})();
</script>
</body>
</html>
