<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Активность — RNDM Chat</title><style>
:root {
  --bg: #090b14;
  --panel: rgba(255,255,255,.08);
  --panel-strong: rgba(255,255,255,.13);
  --text: #f6f8ff;
  --muted: #aab3cc;
  --accent: #7c5cff;
  --accent2: #00e5a8;
  --line: rgba(255,255,255,.12);
  --shadow: 0 28px 70px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  background:
    radial-gradient(circle at 12% 10%, rgba(124,92,255,.35), transparent 32%),
    radial-gradient(circle at 85% 18%, rgba(0,229,168,.24), transparent 28%),
    linear-gradient(135deg, #080912, #11182c 55%, #07131a);
  font-family: Inter, Arial, sans-serif;
}
body.light {
  --bg: #f6f7fb;
  --panel: rgba(255,255,255,.85);
  --panel-strong: #fff;
  --text: #151827;
  --muted: #626b80;
  --line: rgba(13,18,31,.12);
  background: linear-gradient(135deg, #eef2ff, #f8fff9);
}
a { color: inherit; text-decoration: none; }
.topbar {
  position: sticky; top: 0; z-index: 10;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; padding: 18px 6vw;
  backdrop-filter: blur(18px);
  background: rgba(8,9,18,.72);
  border-bottom: 1px solid var(--line);
}
.light .topbar { background: rgba(255,255,255,.76); }
.brand { display: flex; align-items: center; gap: 12px; font-weight: 800; letter-spacing: .2px; }
.logo, .avatar {
  display: inline-grid; place-items: center;
  width: 38px; height: 38px; border-radius: 14px;
  color: white; background: linear-gradient(135deg, var(--accent), var(--accent2));
  box-shadow: 0 10px 30px rgba(124,92,255,.35);
  font-weight: 900;
}
.nav { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.nav a { padding: 10px 14px; color: var(--muted); border-radius: 999px; }
.nav a:hover, .nav .active { color: var(--text); background: var(--panel); }
.theme-toggle { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 14px; padding: 10px 12px; cursor: pointer; }
.hero { min-height: 76vh; display: grid; grid-template-columns: 1.1fr .9fr; align-items: center; gap: 56px; padding: 64px 8vw; }
.hero h1, .page-head h1 { margin: 0; font-size: clamp(38px, 6vw, 76px); line-height: .98; letter-spacing: -2px; }
.lead, .page-head p { color: var(--muted); font-size: 20px; line-height: 1.6; max-width: 760px; }
.eyebrow { color: var(--accent2); text-transform: uppercase; letter-spacing: 2px; font-weight: 800; font-size: 13px; }
.hero-actions, .profile-actions { display: flex; gap: 14px; flex-wrap: wrap; margin: 28px 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); border-radius: 16px; padding: 13px 18px; font-weight: 800; cursor: pointer; transition: transform .2s, box-shadow .2s; }
.btn:hover { transform: translateY(-2px); }
.btn.primary { border: 0; color: #071015; background: linear-gradient(135deg, var(--accent2), #a7ff58); box-shadow: 0 16px 35px rgba(0,229,168,.25); }
.btn.ghost { background: var(--panel); color: var(--text); }
.btn.wide { width: 100%; margin-top: 18px; }
.stats { display: flex; gap: 18px; flex-wrap: wrap; }
.stats div { min-width: 110px; padding: 16px; border: 1px solid var(--line); background: var(--panel); border-radius: 22px; }
.stats b { display: block; font-size: 26px; } .stats span { color: var(--muted); }
.phone-mockup { width: min(420px, 100%); margin-inline: auto; padding: 22px; border-radius: 42px; background: linear-gradient(160deg, rgba(255,255,255,.18), rgba(255,255,255,.06)); border: 1px solid var(--line); box-shadow: var(--shadow); position: relative; overflow: hidden; }
.phone-mockup::before { content: ''; position: absolute; inset: 0; background: radial-gradient(circle at 10% 10%, rgba(255,255,255,.12), transparent 35%); pointer-events: none; }
.phone-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; color: var(--muted); }
.phone-head span { width: 44px; height: 7px; background: var(--line); border-radius: 99px; }
.phone-head i { color: var(--accent2); font-style: normal; }
.bubble { position: relative; max-width: 78%; margin: 12px 0; padding: 14px 16px; border-radius: 20px; line-height: 1.35; }
.bubble.left { background: rgba(255,255,255,.12); }
.bubble.right { background: linear-gradient(135deg, var(--accent), #4d8dff); margin-left: auto; color: #fff; }
.chat-input-demo { margin-top: 22px; padding: 16px 18px; color: var(--muted); border: 1px solid var(--line); border-radius: 18px; background: rgba(0,0,0,.15); }
.features, .roadmap, .page, .profile-layout { padding: 54px 8vw; }
.features h2, .roadmap h2, .settings-card h2, .achievements h2 { font-size: clamp(30px, 4vw, 48px); margin: 0 0 24px; }
.grid { display: grid; gap: 18px; }
.cards { grid-template-columns: repeat(4, 1fr); }
.card, .settings-card, .profile-card, .achievements, .sidebar, .messenger, .friend, .info-grid article { background: var(--panel); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow); }
.card { padding: 28px; } .card span { font-size: 32px; } .card h3 { font-size: 22px; } .card p, .friend p, .messenger p { color: var(--muted); }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 18px; }
.steps div { padding: 24px; border-radius: 28px; border: 1px solid var(--line); background: var(--panel); }
.steps b { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 15px; background: var(--accent); margin-bottom: 14px; }
footer { padding: 34px 8vw; color: var(--muted); border-top: 1px solid var(--line); }
.app-shell { display: grid; grid-template-columns: 300px 1fr; gap: 24px; padding: 38px 6vw; min-height: calc(100vh - 80px); }
.sidebar, .messenger { padding: 22px; }
.sidebar h2 { margin-top: 0; }
.room { width: 100%; display: flex; justify-content: space-between; margin: 9px 0; padding: 14px 16px; border: 1px solid var(--line); color: var(--text); background: transparent; border-radius: 16px; cursor: pointer; text-align: left; }
.room.active, .room:hover { background: var(--panel-strong); }
.messenger { display: flex; flex-direction: column; min-height: 70vh; }
.messenger-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); padding-bottom: 16px; }
.messenger-head h1 { margin: 0; font-size: 34px; }
.badge { padding: 8px 11px; border-radius: 99px; color: #04120d; background: var(--accent2); font-weight: 900; }
.messages { flex: 1; overflow: auto; padding: 18px 0; }
.message { width: fit-content; max-width: 70%; margin: 12px 0; padding: 14px 16px; border-radius: 20px; background: var(--panel-strong); }
.message.me { margin-left: auto; background: linear-gradient(135deg, var(--accent), #4d8dff); }
.message p { margin: 5px 0 0; color: inherit; }
.composer { display: grid; grid-template-columns: 1fr auto; gap: 12px; border-top: 1px solid var(--line); padding-top: 16px; }
input, textarea, select { width: 100%; border: 1px solid var(--line); border-radius: 16px; padding: 13px 14px; color: var(--text); background: var(--panel); outline: none; }
textarea { min-height: 120px; resize: vertical; }
.page-head { margin-bottom: 28px; }
.friend-list { display: grid; gap: 16px; }
.friend { display: flex; align-items: center; gap: 16px; padding: 18px; }
.friend .btn { margin-left: auto; }
.profile-layout { display: grid; grid-template-columns: 360px 1fr; gap: 24px; align-items: start; }
.profile-card.big, .settings-card, .achievements { padding: 28px; }
.avatar.large { width: 120px; height: 120px; border-radius: 34px; font-size: 42px; }
.settings-card label { display: grid; gap: 8px; margin-bottom: 16px; color: var(--muted); }
.achievements { grid-column: 1 / -1; }
.badges { grid-template-columns: repeat(4, 1fr); }
.badges span { padding: 18px; border-radius: 18px; background: var(--panel-strong); }
.info-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
@media (max-width: 900px) {
  .topbar { align-items: flex-start; flex-wrap: wrap; }
  .nav { order: 3; width: 100%; justify-content: flex-start; }
  .hero, .app-shell, .profile-layout { grid-template-columns: 1fr; }
  .cards, .steps, .info-grid, .badges { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 560px) {
  .hero, .features, .roadmap, .page, .profile-layout { padding: 32px 5vw; }
  .hero h1, .page-head h1 { font-size: 40px; letter-spacing: -1px; }
  .lead { font-size: 17px; }
  .cards, .steps, .info-grid, .badges { grid-template-columns: 1fr; }
  .app-shell { padding: 20px 4vw; }
  .composer { grid-template-columns: 1fr; }
  .message { max-width: 86%; }
}

/* Random chat / roulette */
.random-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px 0}.random-actions .btn{min-height:54px}.btn.purple{border:0;color:#fff;background:linear-gradient(135deg,var(--accent),#4d8dff)}
.roulette{display:none;flex-direction:column;gap:16px;min-height:70vh}.roulette.active{display:flex}.messenger.hidden{display:none}.roulette-stage{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1}.video-card{position:relative;min-height:360px;border:1px solid var(--line);border-radius:26px;overflow:hidden;background:radial-gradient(circle at 30% 20%,rgba(135,77,255,.35),transparent 35%),linear-gradient(145deg,#151525,#090a11);display:grid;place-items:center}.video-card.me-video{background:radial-gradient(circle at 70% 20%,rgba(0,229,168,.24),transparent 32%),linear-gradient(145deg,#111b1c,#090a11)}.video-avatar{width:110px;height:110px;border-radius:36px;display:grid;place-items:center;font-size:48px;background:var(--panel-strong);border:1px solid var(--line)}.video-label{position:absolute;left:16px;bottom:16px;padding:8px 12px;border-radius:99px;background:rgba(0,0,0,.48);backdrop-filter:blur(10px)}.roulette-status{text-align:center;color:var(--muted);margin:0}.roulette-controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.roulette-controls .btn{min-width:120px}.danger{background:#ff4967!important;color:#fff!important;border:0!important}.random-banner{padding:18px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(135deg,rgba(135,77,255,.16),rgba(0,229,168,.10));margin-bottom:14px}.random-banner h3{margin:0 0 7px}.random-banner p{margin:0;color:var(--muted)}
@media(max-width:760px){.random-actions,.roulette-stage{grid-template-columns:1fr}.video-card{min-height:250px}.roulette-stage .me-video{min-height:160px}.roulette-controls .btn{flex:1;min-width:0}}

/* Saved profile + user picker */
.save-note{font-size:13px;color:var(--muted);margin:8px 0 0}.roulette-picker{display:none;flex-direction:column;gap:18px;min-height:70vh}.roulette-picker.active{display:flex}.user-reel-wrap{position:relative;overflow:hidden;min-height:290px;display:grid;place-items:center;border:1px solid var(--line);border-radius:28px;background:linear-gradient(145deg,rgba(124,92,255,.12),rgba(0,229,168,.07))}.reel-pointer{position:absolute;z-index:3;top:10px;left:50%;transform:translateX(-50%);font-size:28px;color:var(--accent2);filter:drop-shadow(0 0 12px var(--accent2))}.user-reel{display:flex;gap:16px;align-items:center;width:max-content;transform:translateX(0);will-change:transform}.reel-user{width:150px;min-width:150px;height:190px;padding:18px 12px;border:1px solid var(--line);border-radius:24px;background:var(--panel-strong);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;opacity:.55;transform:scale(.9);transition:.25s}.reel-user.focus{opacity:1;transform:scale(1.08);box-shadow:0 0 0 2px var(--accent2),0 18px 50px rgba(0,229,168,.18)}.reel-user .face{width:72px;height:72px;border-radius:24px;display:grid;place-items:center;font-size:34px;background:linear-gradient(135deg,rgba(124,92,255,.3),rgba(0,229,168,.22));margin-bottom:12px}.reel-user b{font-size:17px}.reel-user small{color:var(--muted);margin-top:5px}.profile-saved{animation:savedPulse .55s ease}@keyframes savedPulse{50%{transform:scale(1.03);box-shadow:0 0 0 4px rgba(0,229,168,.15)}}

/* Avatar upload */
.avatar-editor{display:flex;flex-direction:column;align-items:center}.avatar-upload{position:relative;border:0;cursor:pointer;overflow:visible;color:inherit}.avatar-upload #profileAvatar{width:100%;height:100%;display:grid;place-items:center;border-radius:34px;overflow:hidden;background:linear-gradient(135deg,var(--accent),var(--accent2))}.avatar-upload #profileAvatar img{width:100%;height:100%;object-fit:cover;display:block}.avatar-edit-badge{position:absolute;right:-6px;bottom:-6px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--panel-strong);border:2px solid var(--accent2);font-size:17px;box-shadow:var(--shadow)}.avatar-actions{display:flex;gap:8px;margin-top:16px}.btn.small{padding:9px 13px;font-size:13px}.avatar-hint{color:var(--muted);max-width:260px;text-align:center;margin-top:10px;line-height:1.4}.avatar-upload:hover{transform:translateY(-2px)}

/* v6 power features */
.powerbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line)}
.powerbar input{flex:1;min-width:180px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:inherit}
.mini-btn{border:1px solid var(--line);background:var(--card);color:inherit;border-radius:10px;padding:8px 10px;cursor:pointer}.mini-btn.on{outline:2px solid #8b5cf6}
.message{position:relative}.message-actions{display:flex;gap:5px;margin-top:5px;opacity:.7}.message-actions button{font-size:12px;border:0;background:transparent;color:inherit;cursor:pointer;padding:2px 4px}.reaction{font-size:12px;margin-left:6px}
.toast{position:fixed;right:20px;bottom:20px;background:#111827;color:white;padding:12px 16px;border-radius:12px;z-index:99;box-shadow:0 12px 35px #0005}.history-box{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.history-chip{display:inline-flex;gap:5px;margin:4px;padding:6px 9px;border-radius:999px;background:var(--card);font-size:12px}.blocked{opacity:.45;filter:grayscale(1)}
/* v7 roulette reliability */
.user-reel-wrap{overflow:hidden}.user-reel{max-width:100%;overflow-x:auto;scroll-behavior:smooth;padding:28px calc(50% - 75px);scrollbar-width:none}.user-reel::-webkit-scrollbar{display:none}.roulette-controls button:disabled{opacity:.55;cursor:not-allowed}
/* v8 channels + stars */
.channels-page{padding:42px 6vw}.channels-head{display:flex;justify-content:space-between;gap:24px;align-items:flex-start}.channels-head h1{font-size:clamp(42px,6vw,72px);margin:4px 0}.stars-wallet{min-width:210px;padding:18px;border:1px solid var(--line);border-radius:24px;background:var(--panel);display:grid;gap:8px}.stars-wallet b{font-size:34px}.channel-tools{display:flex;gap:10px;margin:24px 0}.channel-tools input{max-width:520px}.channel-layout{display:grid;grid-template-columns:300px 1fr;gap:20px}.channel-list,.channel-feed{border:1px solid var(--line);border-radius:28px;background:var(--panel);padding:16px;min-height:620px}.channel-item{display:flex;align-items:center;gap:12px;width:100%;padding:12px;border:0;border-radius:18px;background:transparent;color:inherit;text-align:left;cursor:pointer}.channel-item:hover,.channel-item.active{background:var(--panel-strong)}.channel-icon{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-size:25px;background:linear-gradient(135deg,rgba(124,92,255,.28),rgba(0,229,168,.18))}.channel-item small{display:block;color:var(--muted);margin-top:3px}.channel-hero{padding:22px;border-radius:22px;background:linear-gradient(135deg,rgba(124,92,255,.17),rgba(0,229,168,.09));margin-bottom:16px}.channel-hero-top{display:flex;gap:14px;align-items:center}.channel-hero .channel-icon{width:64px;height:64px;font-size:32px}.channel-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.channel-post{padding:18px;margin:12px 0;border:1px solid var(--line);border-radius:20px;background:var(--panel-strong)}.channel-post p{white-space:pre-wrap}.post-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}.post-actions{display:flex;gap:8px;margin-top:12px}.owner-composer{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:20px;margin-bottom:14px}.owner-composer textarea{min-height:90px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#0009;z-index:100;display:grid;place-items:center;padding:20px}.modal-card{width:min(520px,100%);max-height:80vh;overflow:auto;padding:24px;border-radius:24px;background:var(--panel);border:1px solid var(--line);position:relative}.modal-x{position:absolute;right:14px;top:12px;border:0;background:transparent;color:inherit;font-size:28px;cursor:pointer}.star-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
@media(max-width:800px){.channels-head{display:grid}.stars-wallet{width:100%}.channel-tools{flex-wrap:wrap}.channel-layout{grid-template-columns:1fr}.channel-list{min-height:0}.channel-feed{min-height:500px}}
/* v9 cat tapper */
.cat-page{min-height:calc(100vh - 150px);display:grid;place-items:center;padding:42px 6vw}.cat-game{width:min(720px,100%);text-align:center;padding:34px;border:1px solid var(--line);border-radius:32px;background:var(--panel);box-shadow:var(--shadow)}.cat-game h1{font-size:clamp(42px,7vw,72px);margin:8px 0}.cat-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:26px 0}.cat-stats div{padding:16px;border-radius:20px;background:var(--panel-strong)}.cat-stats b{display:block;font-size:26px}.cat-stats span{color:var(--muted);font-size:13px}.cat-button{position:relative;width:230px;height:230px;border:0;border-radius:50%;cursor:pointer;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.24),transparent 25%),linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 25px 70px rgba(124,92,255,.28);transition:transform .08s ease;user-select:none;-webkit-tap-highlight-color:transparent}.cat-button:active,.cat-button.tap{transform:scale(.92)}.cat-emoji{font-size:116px;filter:drop-shadow(0 10px 14px #0004)}.cat-pop{position:absolute;top:15px;right:22px;font-weight:900;font-size:24px;opacity:0;pointer-events:none}.cat-pop.show{animation:catPop .45s ease}@keyframes catPop{0%{opacity:1;transform:translateY(15px) scale(.8)}100%{opacity:0;transform:translateY(-30px) scale(1.25)}}.cat-progress{margin:28px auto 16px;max-width:480px}.cat-progress>div:first-child{display:flex;justify-content:space-between;margin-bottom:8px;color:var(--muted)}.cat-track{height:14px;border-radius:99px;background:var(--panel-strong);overflow:hidden}.cat-track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:inherit;transition:width .2s}.cat-button.reward{animation:reward .55s ease}@keyframes reward{50%{transform:scale(1.12) rotate(4deg);filter:brightness(1.3)}}@media(max-width:560px){.cat-game{padding:24px 16px}.cat-button{width:190px;height:190px}.cat-emoji{font-size:96px}.cat-stats{grid-template-columns:1fr 1fr 1fr}.cat-stats b{font-size:20px}}
/* v10 attachments + comments + subscriber roulette */

/* app.js — встроено в страницу */
const body = document.body;
const themeToggle = document.getElementById('themeToggle');
const savedTheme = localStorage.getItem('rndm-theme');
if (savedTheme === 'light') body.classList.add('light');
if (themeToggle) themeToggle.textContent = body.classList.contains('light') ? '☀️' : '🌙';

themeToggle?.addEventListener('click', () => {
  body.classList.toggle('light');
  localStorage.setItem('rndm-theme', body.classList.contains('light') ? 'light' : 'dark');
  themeToggle.textContent = body.classList.contains('light') ? '☀️' : '🌙';

const rooms = document.querySelectorAll('.room');
const roomTitle = document.getElementById('roomTitle');
const messages = document.getElementById('messages');
const messageForm = document.getElementById('messageForm');
const messageInput = document.getElementById('messageInput');
const randomRoom = document.getElementById('randomRoom');
const roomNames = ['Главная', 'Игры', 'Учёба', 'Музыка'];
let activeRandomPerson = null;
let replyTimer = null;

function addMessage(text, type = 'me', name = 'Я') {
  if (!messages) return;
  const item = document.createElement('div');
  item.className = `message ${type}`;
  item.innerHTML = `<b>${name}</b><p>${text}</p>`;
  messages.appendChild(item);
  messages.scrollTop = messages.scrollHeight;
}

rooms.forEach(btn => {
  btn.addEventListener('click', () => {
    rooms.forEach(r => r.classList.remove('active'));
    btn.classList.add('active');
    activeRandomPerson = null;
    const room = btn.dataset.room;
    if (roomTitle) roomTitle.textContent = `# ${room}`;
    addMessage(`Вы перешли в комнату «${room}».`, 'other', 'RNDM Bot');
  });
});

randomRoom?.addEventListener('click', () => {
  const random = roomNames[Math.floor(Math.random() * roomNames.length)];
  const target = [...rooms].find(r => r.dataset.room === random);
  target?.click();
});

function getDemoReply(text, person) {
  const t = text.toLowerCase();
  const name = person?.[0] || 'Собеседник';
  const pools = {
    hello: ['Привет 👋 Рад знакомству!', 'Хэй! Как дела?', 'Привет :) Что делаешь?'],
    how: ['Нормально, спасибо 😄 А у тебя?', 'Отлично! Сегодня довольно спокойный день.', 'Всё хорошо. Решил зайти сюда пообщаться.'],
    name: [`Я ${name} 🙂 А тебя как зовут?`, `Можно просто ${name}. А ты?`],
    games: ['Да, люблю игры 🎮 Сейчас больше всего играю с друзьями.', 'Иногда играю. Что посоветуешь?', 'О, да! Кооперативные игры особенно нравятся.'],
    music: ['Музыку люблю 🎧 Обычно включаю что-нибудь спокойное.', 'Да! Скинул бы тебе свой плейлист, если бы тут уже были ссылки 😄'],
    school: ['Учёба бывает тяжёлая 😅 Но сегодня вроде нормально.', 'Смотря какой предмет. Информатика мне нравится больше всего.'],
    where: ['Я здесь просто в демо RNDM Chat 😄 А ты откуда?', 'Давай пока без точного адреса 😄 Но можем поговорить о городе.'],
    bye: ['Пока! Было приятно пообщаться 👋', 'Увидимся! Хорошего дня ✨'],
    default: ['Интересно 🙂 Расскажи подробнее.', 'Понимаю тебя. А что было дальше?', 'Хаха, прикольно 😄', 'Согласен! А ты давно этим интересуешься?', 'О, неожиданно. Почему именно так?', 'Звучит круто 👀', 'Да, я бы тоже так сделал.', 'А что тебе в этом нравится больше всего?']
  };
  if (/привет|здрав|хай|hello|hey/.test(t)) return pick(pools.hello);
  if (/как дела|как ты|как жизнь/.test(t)) return pick(pools.how);
  if (/как зовут|тво[её] имя|имя/.test(t)) return pick(pools.name);
  if (/игр|minecraft|майнкрафт|unreal|анрил/.test(t)) return pick(pools.games);
  if (/музык|песн|трек/.test(t)) return pick(pools.music);
  if (/уч[её]б|колледж|школ|урок/.test(t)) return pick(pools.school);
  if (/откуда|где жив/.test(t)) return pick(pools.where);
  if (/пока|до свид|увидим/.test(t)) return pick(pools.bye);
  return pick(pools.default);
}
function pick(items){ return items[Math.floor(Math.random()*items.length)]; }
function showTyping(name) {
  if (!messages) return null;
  const item = document.createElement('div');
  item.className = 'message other typing-message';
  item.innerHTML = `<b>${name}</b><p>печатает<span class="typing-dots">...</span></p>`;
  messages.appendChild(item); messages.scrollTop = messages.scrollHeight;
  return item;
}
function answerAsRandomPerson(text) {
  if (!activeRandomPerson) return;
  clearTimeout(replyTimer);
  const person = activeRandomPerson;
  const typing = showTyping(person[0]);
  replyTimer = setTimeout(() => {
    typing?.remove();
    if (activeRandomPerson === person) addMessage(getDemoReply(text, person), 'other', person[0]);
  }, 700 + Math.floor(Math.random()*1100));
}

messageForm?.addEventListener('submit', (event) => {
  event.preventDefault();
  const text = messageInput.value.trim();
  if (!text) return;
  addMessage(text);
  messageInput.value = '';
  if (activeRandomPerson) answerAsRandomPerson(text);
  else setTimeout(() => addMessage('Сообщение получено ✅', 'other', 'RNDM Bot'), 350);
});

const PROFILE_KEY = 'rndm-profile-v1';
const defaultProfile = {name:'Сергей',nick:'Sergey_RNDM',age:'17',city:'Москва',status:'тестирую новый мессенджер',bio:'Люблю игры, сайты и новые проекты.',theme:'dark',avatar:''};
function loadProfile(){ try{return {...defaultProfile,...JSON.parse(localStorage.getItem(PROFILE_KEY)||'{}')}}catch{return {...defaultProfile}} }
function saveProfileData(){
  const current=loadProfile(); const profile={name:document.getElementById('profileName')?.value.trim()||'Пользователь',nick:document.getElementById('profileNick')?.value.trim()||'rndm_user',age:document.getElementById('profileAge')?.value||'',city:document.getElementById('profileCity')?.value.trim()||'',status:document.getElementById('profileStatus')?.value.trim()||'',bio:document.getElementById('profileBio')?.value.trim()||'',theme:document.getElementById('profileTheme')?.value||'dark',avatar:current.avatar||''};
  localStorage.setItem(PROFILE_KEY,JSON.stringify(profile)); localStorage.setItem('rndm-theme',profile.theme);
  renderProfile(profile); document.body.classList.toggle('light',profile.theme==='light'); if(themeToggle) themeToggle.textContent=profile.theme==='light'?'☀️':'🌙';
  const note=document.getElementById('profileSaveNote'); if(note){note.textContent='✓ Профиль сохранён. Он восстановится после перезагрузки.';note.classList.add('profile-saved');setTimeout(()=>note.classList.remove('profile-saved'),600)}
}
function renderProfile(p){
  const map={profileName:p.name,profileNick:p.nick,profileAge:p.age,profileCity:p.city,profileStatus:p.status,profileBio:p.bio,profileTheme:p.theme};
  Object.entries(map).forEach(([id,v])=>{const el=document.getElementById(id);if(el)el.value=v});
  const title=document.getElementById('profileDisplayName'); if(title) title.textContent=p.nick||p.name;
  const status=document.getElementById('profileDisplayStatus'); if(status) status.textContent='Статус: '+(p.status||'в сети');
  const av=document.getElementById('profileAvatar'); if(av){ if(p.avatar){av.innerHTML=`<img src="${p.avatar}" alt="Аватар">`;av.classList.add('has-photo')}else{av.textContent=(p.name||p.nick||'R').charAt(0).toUpperCase();av.classList.remove('has-photo')} }
}
renderProfile(loadProfile());
document.getElementById('saveProfile')?.addEventListener('click', saveProfileData);

const avatarFile=document.getElementById('avatarFile');
const chooseAvatar=document.getElementById('chooseAvatar');
const avatarUploadButton=document.getElementById('avatarUploadButton');
const removeAvatar=document.getElementById('removeAvatar');
function openAvatarPicker(){ avatarFile?.click(); }
chooseAvatar?.addEventListener('click',openAvatarPicker);
avatarUploadButton?.addEventListener('click',openAvatarPicker);
avatarFile?.addEventListener('change',()=>{
  const file=avatarFile.files?.[0]; if(!file)return;
  if(!file.type.startsWith('image/'))return;
  if(file.size>4*1024*1024){ const note=document.getElementById('profileSaveNote'); if(note)note.textContent='Файл слишком большой. Выберите изображение до 4 МБ.'; return; }
  const reader=new FileReader();
  reader.onload=()=>{ const p=loadProfile(); p.avatar=reader.result; localStorage.setItem(PROFILE_KEY,JSON.stringify(p)); renderProfile(p); const note=document.getElementById('profileSaveNote');if(note)note.textContent='✓ Аватар изменён и сохранён.'; };
  reader.readAsDataURL(file);
});
removeAvatar?.addEventListener('click',()=>{ const p=loadProfile();p.avatar='';localStorage.setItem(PROFILE_KEY,JSON.stringify(p));renderProfile(p);if(avatarFile)avatarFile.value='';const note=document.getElementById('profileSaveNote');if(note)note.textContent='Аватар удалён.'; });


const randomPerson = document.getElementById('randomPerson');
const openRoulette = document.getElementById('openRoulette');
const roulettePanel = document.getElementById('roulettePanel');
const pickerPanel = document.getElementById('pickerPanel');
const normalMessenger = document.querySelector('.messenger:not(.roulette):not(.roulette-picker)');
const rouletteStatus = document.getElementById('rouletteStatus');
const rouletteBadge = document.getElementById('rouletteBadge');
const strangerAvatar = document.getElementById('strangerAvatar');
const strangerLabel = document.getElementById('strangerLabel');
const demoPeople = [
  ['Алекс', '🎧', 'Привет! Я тоже попал сюда случайно 👋'],
  ['Мия', '🌙', 'Привет! Как проходит день?'],
  ['Макс', '🎮', 'О, привет! Во что играешь?'],
  ['Лера', '✨', 'Привет :) Давай знакомиться!'],
  ['Ник', '🛹', 'Хэй! Что интересного?'],
  ['Аня', '📚', 'Привет! Чем увлекаешься?'],
  ['Даня', '⚡', 'Йо! Как настроение?'],
  ['Саша', '🎨', 'Привет :) Что сегодня делаешь?'],
  ['Кира', '🌸', 'Привет! Рада знакомству!']
];
function randomDemoPerson(){ return demoPeople[Math.floor(Math.random()*demoPeople.length)]; }
function hideSpecial(){roulettePanel?.classList.remove('active');pickerPanel?.classList.remove('active')}
function showChat(){ hideSpecial(); normalMessenger?.classList.remove('hidden'); }
function showRoulette(){ hideSpecial();normalMessenger?.classList.add('hidden'); roulettePanel?.classList.add('active'); }
function showPicker(){hideSpecial();normalMessenger?.classList.add('hidden');pickerPanel?.classList.add('active');renderReel();}
function connectRoulette(){
  if (!rouletteStatus) return;
  rouletteStatus.textContent='Ищем свободного собеседника…'; rouletteBadge.textContent='SEARCH'; strangerAvatar.textContent='…'; strangerLabel.textContent='Поиск…';
  setTimeout(()=>{ const p=randomDemoPerson(); strangerAvatar.textContent=p[1]; strangerLabel.textContent=p[0]+' • онлайн'; rouletteStatus.textContent='Соединение установлено • демо-режим'; rouletteBadge.textContent='LIVE'; },700);
}
const userReel=document.getElementById('userReel'); const pickerStatus=document.getElementById('pickerStatus'); const pickerBadge=document.getElementById('pickerBadge'); let spinning=false;
function renderReel(focus=-1){if(!userReel)return; const list=[...demoPeople,...demoPeople,...demoPeople];userReel.innerHTML=list.map((p,i)=>`<div class="reel-user ${i===focus?'focus':''}"><div class="face">${p[1]}</div><b>${p[0]}</b><small>● онлайн</small></div>`).join('');}
function openPersonChat(p){showChat();activeRandomPerson=p;if(roomTitle)roomTitle.textContent='🎲 '+p[0]+' • случайный собеседник';if(messages){messages.innerHTML='';addMessage('Рулетка выбрала пользователя '+p[0]+'. Начните диалог.','other','RNDM Bot');setTimeout(()=>addMessage(p[2],'other',p[0]),450)}}
function spinUserRoulette(){
  if(spinning || !userReel || !pickerPanel?.classList.contains('active')) return;
  spinning=true;
  const spinBtn=document.getElementById('spinUsers');
  if(spinBtn){spinBtn.disabled=true;spinBtn.textContent='Крутим…';}
  if(pickerBadge) pickerBadge.textContent='SPIN';
  if(pickerStatus) pickerStatus.textContent='Рулетка выбирает собеседника…';
  const winner=Math.floor(Math.random()*demoPeople.length);
  const totalSteps=22+winner;
  let step=0;
  let delay=55;
  const tick=()=>{
    const idx=step%demoPeople.length;
    renderReel(demoPeople.length+idx);
    const cards=[...userReel.children];
    const focus=cards[demoPeople.length+idx];
    focus?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
    step++;
    if(step<=totalSteps){
      if(step>totalSteps-8) delay+=38;
      setTimeout(tick,delay);
      return;
    }
    const p=demoPeople[winner];
    renderReel(demoPeople.length+winner);
    const finalCard=userReel.children[demoPeople.length+winner];
    finalCard?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
    if(pickerBadge) pickerBadge.textContent='FOUND';
    if(pickerStatus) pickerStatus.textContent='Выбран пользователь: '+p[0]+' — открываем чат…';
    if(spinBtn){spinBtn.disabled=false;spinBtn.textContent='Крутить ещё';}
    spinning=false;
    setTimeout(()=>openPersonChat(p),850);
  };
  tick();
}
randomPerson?.addEventListener('click',()=>{showPicker();setTimeout(spinUserRoulette,180)});
document.getElementById('spinUsers')?.addEventListener('click',spinUserRoulette);
document.getElementById('cancelPicker')?.addEventListener('click',()=>{spinning=false;showChat()});
openRoulette?.addEventListener('click',()=>{showRoulette();connectRoulette();});
document.getElementById('startRoulette')?.addEventListener('click',connectRoulette);
document.getElementById('nextRoulette')?.addEventListener('click',connectRoulette);
document.getElementById('stopRoulette')?.addEventListener('click',()=>{rouletteStatus.textContent='Чат остановлен';rouletteBadge.textContent='STOP';strangerAvatar.textContent='?';strangerLabel.textContent='Собеседник';});
document.getElementById('backToChat')?.addEventListener('click',showChat);
['toggleMic','toggleCam'].forEach(id=>document.getElementById(id)?.addEventListener('click',e=>{e.currentTarget.classList.toggle('danger'); e.currentTarget.textContent=(id==='toggleMic'?'🎙 ':'📷 ')+(e.currentTarget.classList.contains('danger')?'Выкл.':'Вкл.');}));

// ---- RNDM Chat v6: messenger power features ----
const CHAT_KEY='rndm-chat-history-v2', SETTINGS_KEY='rndm-settings-v2', ROULETTE_HISTORY='rndm-roulette-history';
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;document.body.appendChild(x);setTimeout(()=>x.remove(),1800)}
function persistMessages(){if(!messages)return;const data=[...messages.querySelectorAll('.message')].map(m=>({html:m.innerHTML,type:m.classList.contains('me')?'me':'other'}));localStorage.setItem(CHAT_KEY,JSON.stringify(data))}
function restoreMessages(){if(!messages)return;try{const d=JSON.parse(localStorage.getItem(CHAT_KEY)||'null');if(d?.length){messages.innerHTML='';d.forEach(x=>{const n=document.createElement('div');n.className='message '+x.type;n.innerHTML=x.html;messages.appendChild(n)})}}catch{}}
restoreMessages();
const oldAddMessage=addMessage; addMessage=function(text,type='me',name='Я'){oldAddMessage(text,type,name);const m=messages?.lastElementChild;if(m){const a=document.createElement('div');a.className='message-actions';a.innerHTML=type==='me'?'<button data-act="react">❤️</button><button data-act="edit">✏️</button><button data-act="delete">🗑️</button>':'<button data-act="react">❤️</button><button data-act="reply">↩ Ответить</button>';m.appendChild(a)}persistMessages()};
messages?.addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(!b)return;const m=b.closest('.message'),p=m.querySelector('p');if(b.dataset.act==='delete'){m.remove();toast('Сообщение удалено')}if(b.dataset.act==='edit'){const v=prompt('Изменить сообщение',p.textContent);if(v!==null&&v.trim()){p.textContent=v.trim();toast('Сообщение изменено')}}if(b.dataset.act==='react'){let r=m.querySelector('.reaction');if(!r){r=document.createElement('span');r.className='reaction';r.textContent='❤️ 1';p.appendChild(r)}else r.remove()}if(b.dataset.act==='reply'){messageInput.value='↩ '+p.textContent.slice(0,35)+' — ';messageInput.focus()}persistMessages()});
document.getElementById('chatSearch')?.addEventListener('input',e=>{const q=e.target.value.toLowerCase();messages.querySelectorAll('.message').forEach(m=>m.style.display=m.textContent.toLowerCase().includes(q)?'':'none')});
document.getElementById('clearChat')?.addEventListener('click',()=>{if(confirm('Очистить историю чата?')){messages.innerHTML='';persistMessages();toast('История очищена')}});
function settings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}catch{return{}}}function setSetting(k,v){const s=settings();s[k]=v;localStorage.setItem(SETTINGS_KEY,JSON.stringify(s))}
['pinChat','muteChat'].forEach(id=>{const b=document.getElementById(id);if(!b)return;const key=id==='pinChat'?'pinned':'muted';if(settings()[key])b.classList.add('on');b.addEventListener('click',()=>{b.classList.toggle('on');setSetting(key,b.classList.contains('on'));toast(key==='pinned'?(b.classList.contains('on')?'Чат закреплён':'Чат откреплён'):(b.classList.contains('on')?'Уведомления выключены':'Уведомления включены'))})});
function saveRoulettePerson(p){let h=[];try{h=JSON.parse(localStorage.getItem(ROULETTE_HISTORY)||'[]')}catch{}h=[p,...h.filter(x=>x[0]!==p[0])].slice(0,6);localStorage.setItem(ROULETTE_HISTORY,JSON.stringify(h));renderRouletteHistory()}
function renderRouletteHistory(){const box=document.getElementById('rouletteHistory');if(!box)return;let h=[];try{h=JSON.parse(localStorage.getItem(ROULETTE_HISTORY)||'[]')}catch{}box.innerHTML=h.length?h.map(p=>`<span class="history-chip">${p[1]} ${p[0]}</span>`).join(''):'<small>История пока пустая</small>'}renderRouletteHistory();
const oldOpenPersonChat=openPersonChat;openPersonChat=function(p){saveRoulettePerson(p);oldOpenPersonChat(p)};
// Keyboard shortcuts + draft autosave
const DRAFT='rndm-draft';if(messageInput){messageInput.value=localStorage.getItem(DRAFT)||'';messageInput.addEventListener('input',()=>localStorage.setItem(DRAFT,messageInput.value));messageForm?.addEventListener('submit',()=>localStorage.removeItem(DRAFT));document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();messageInput.focus()}if(e.key==='Escape'&&document.activeElement===messageInput)messageInput.blur()})}

const CHANNELS_KEY='rndm-channels-v1', STARS_KEY='rndm-stars-v1', STAR_LOG_KEY='rndm-star-log-v1';
const starterChannels=[
 {id:'rndm-news',name:'RNDM News',icon:'📣',desc:'Новости проекта, обновления и новые функции.',subs:12840,joined:true,owner:false,posts:[{id:1,text:'Добро пожаловать в каналы RNDM Chat! Теперь здесь можно публиковать посты, ставить реакции и поддерживать авторов звёздами ⭐',likes:326,stars:54,date:'Сегодня, 10:30'}]},

function loadChannels(){try{const x=JSON.parse(localStorage.getItem(CHANNELS_KEY)||'null');return x?.length?x:structuredClone(starterChannels)}catch{return JSON.parse(JSON.stringify(starterChannels))}}
function saveChannels(x){localStorage.setItem(CHANNELS_KEY,JSON.stringify(x))}

function setStars(n){localStorage.setItem(STARS_KEY,String(Math.max(0,n)));const e=document.getElementById('starsBalance');if(e)e.textContent=getStars()}

let channels=loadChannels(),activeChannel=channels[0]?.id;
function fmtSubs(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1)+'K':String(n)}
function renderChannelList(filter=''){const box=document.getElementById('channelList');if(!box)return;const q=filter.toLowerCase();box.innerHTML=channels.filter(c=>(c.name+' '+c.desc).toLowerCase().includes(q)).map(c=>`<button class="channel-item ${c.id===activeChannel?'active':''}" data-channel="${c.id}"><span class="channel-icon">${c.icon}</span><span><b>${c.name}</b><small>${fmtSubs(c.subs)} подписчиков ${c.joined?'• ✓ подписка':''}</small></span></button>`).join('')||'<p class="lead">Ничего не найдено</p>';}
function renderActiveChannel(){const c=channels.find(x=>x.id===activeChannel);if(!c)return;const hero=document.getElementById('channelHero'),posts=document.getElementById('channelPosts'),composer=document.getElementById('ownerComposer');if(hero)hero.innerHTML=`<div class="channel-hero-top"><span class="channel-icon">${c.icon}</span><div><h2>${c.name}</h2><p>${c.desc}</p><small>${c.subs.toLocaleString('ru-RU')} подписчиков</small></div></div><div class="channel-actions"><button class="btn ${c.joined?'ghost':'primary'}" id="toggleSub">${c.joined?'✓ Вы подписаны':'Подписаться'}</button><button class="btn purple" id="sendChannelStars">⭐ Поддержать</button></div>`;if(composer)composer.classList.toggle('hidden',!c.owner);if(posts)posts.innerHTML=[...c.posts].reverse().map(p=>`<article class="channel-post"><div class="post-meta"><b>${c.name}</b><span>${p.date}</span></div><p>${p.text}</p><div class="post-actions"><button class="mini-btn" data-like="${p.id}">❤️ ${p.likes||0}</button><button class="mini-btn" data-starpost="${p.id}">⭐ ${p.stars||0}</button></div></article>`).join('')||'<p class="lead">Публикаций пока нет.</p>';document.getElementById('toggleSub')?.addEventListener('click',()=>{c.joined=!c.joined;c.subs+=c.joined?1:-1;saveChannels(channels);renderChannelList(document.getElementById('channelSearch')?.value||'');renderActiveChannel();toast(c.joined?'Вы подписались':'Подписка отменена')});document.getElementById('sendChannelStars')?.addEventListener('click',()=>sendStars(c));}
function sendStars(c,post){const raw=prompt(`Сколько ⭐ отправить ${post?'публикации':'каналу'} «${c.name}»?\nВаш баланс: ${getStars()} ⭐`,'10');if(raw===null)return;const n=Math.floor(Number(raw));if(!n||n<1)return toast('Введите количество звёзд');if(n>getStars())return toast('Недостаточно звёзд');setStars(getStars()-n);if(post)post.stars=(post.stars||0)+n;starLog(`Отправлено в ${c.name}`, -n);saveChannels(channels);renderActiveChannel();toast(`Отправлено ${n} ⭐`) }
document.getElementById('channelList')?.addEventListener('click',e=>{const b=e.target.closest('[data-channel]');if(!b)return;activeChannel=b.dataset.channel;renderChannelList(document.getElementById('channelSearch')?.value||'');renderActiveChannel()});
document.getElementById('channelPosts')?.addEventListener('click',e=>{const like=e.target.closest('[data-like]'),star=e.target.closest('[data-starpost]'),c=channels.find(x=>x.id===activeChannel);if(!c)return;if(like){const p=c.posts.find(x=>String(x.id)===like.dataset.like);p.likes=(p.likes||0)+1;saveChannels(channels);renderActiveChannel()}if(star){const p=c.posts.find(x=>String(x.id)===star.dataset.starpost);sendStars(c,p)}});

document.getElementById('demoStars')?.addEventListener('click',()=>{setStars(getStars()+100);starLog('Получено демо-пополнение',100);toast('+100 ⭐ добавлено')});
document.getElementById('createChannel')?.addEventListener('click',()=>{const name=prompt('Название нового канала');if(!name?.trim())return;const desc=prompt('Короткое описание канала','Мой канал в RNDM Chat')||'';const c={id:'user-'+Date.now(),name:name.trim(),icon:'📡',desc,subs:1,joined:true,owner:true,posts:[]};channels.unshift(c);activeChannel=c.id;saveChannels(channels);renderChannelList();renderActiveChannel();toast('Канал создан')});
document.getElementById('publishPost')?.addEventListener('click',()=>{const t=document.getElementById('postText'),c=channels.find(x=>x.id===activeChannel);if(!c?.owner||!t?.value.trim())return;c.posts.push({id:Date.now(),text:t.value.trim(),likes:0,stars:0,date:new Date().toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})});t.value='';saveChannels(channels);renderActiveChannel();toast('Публикация добавлена')});
function renderStarHistory(){const b=document.getElementById('starsHistory');if(!b)return;let x=[];try{x=JSON.parse(localStorage.getItem(STAR_LOG_KEY)||'[]')}catch{}b.innerHTML=x.length?x.map(i=>`<div class="star-row"><span>${i.text}<small><br>${i.date}</small></span><b>${i.amount>0?'+':''}${i.amount} ⭐</b></div>`).join(''):'<p>Операций пока нет.</p>'}

// Conversation-aware demo replies: use recent dialogue and current topic.
const contextByPerson={};
getDemoReply=function(text,person){const name=person?.[0]||'Собеседник',key=name,t=text.toLowerCase();const h=contextByPerson[key]||(contextByPerson[key]=[]);h.push(t);if(h.length>6)h.shift();const all=h.join(' ');let topic='общение';if(/игр|minecraft|майнкрафт|unreal|анрил|steam/.test(all))topic='игры';else if(/музык|песн|трек|исполнител/.test(all))topic='музыка';else if(/уч[её]б|колледж|школ|урок|проект|сайт|код/.test(all))topic='учёба и проекты';else if(/фильм|сериал|кино/.test(all))topic='кино';else if(/спорт|футбол|волейбол|тренир/.test(all))topic='спорт';if(/привет|здрав|хай|hello|hey/.test(t))return `Привет 👋 Я ${name}. О чём хочешь поговорить?`;if(/как дела|как ты|как жизнь/.test(t))return `Нормально 😄 А у тебя? Мы можем продолжить про ${topic}.`;if(/как зовут|тво[её] имя/.test(t))return `Я ${name} 🙂 А тебя как зовут?`;if(/пока|до свид|увидим/.test(t))return 'Пока! Было приятно пообщаться 👋';const topicReplies={
'игры':['Да, игры — хорошая тема 🎮 А во что ты сейчас играешь чаще всего?','Если выбирать кооператив, я бы играл с друзьями. Тебе больше нравится выживание или шутеры?','Ты упомянул игры — а какая механика для тебя самая важная?'],
'музыка':['🎧 А какой жанр тебе сейчас больше всего заходит?','Если продолжать про музыку: ты чаще слушаешь плейлисты или отдельных исполнителей?','Какой трек ты бы включил прямо сейчас?'],
'учёба и проекты':['Звучит как интересный проект. Что в нём уже реально работает?','Если продолжать про проект: интерфейс или функциональность сейчас важнее?','А какую следующую функцию ты хочешь добавить в проект?'],
'кино':['А какой фильм или сериал из последних тебе реально понравился?','Я бы продолжил тему кино: тебе больше нравятся комедии, фантастика или триллеры?'],
'спорт':['Круто. Ты сам занимаешься или больше смотришь?','А какая команда или вид спорта тебе нравится больше всего?'],
'общение':['Понял 🙂 Расскажи подробнее, интересно продолжить эту мысль.','А почему ты так думаешь?','Интересно. Что было дальше?']};return pick(topicReplies[topic]);};

function loadContacts(){try{const x=JSON.parse(localStorage.getItem(CONTACTS_KEY)||'null');return Array.isArray(x)?x:starterContacts}catch{return starterContacts}}

    {id:'talker',icon:'💬',name:'Собеседник',desc:'Отправить 25 сообщений',test:p=>p.messages>=25},
    {id:'cat100',icon:'🐱',name:'Котофан',desc:'Сделать 100 тапов',test:p=>p.taps>=100},
    {id:'cat1000',icon:'👑',name:'Повелитель кота',desc:'Сделать 1000 тапов',test:p=>p.taps>=1000},
    {id:'viewer',icon:'▶️',name:'Залип в Clips',desc:'Посмотреть 25 клипов',test:p=>p.clipsViewed>=25},
    {id:'heart',icon:'❤️',name:'Поддержка',desc:'Поставить 10 лайков',test:p=>p.clipLikes>=10},
    {id:'creator',icon:'🎬',name:'Автор',desc:'Добавить свой клип',test:p=>p.clipUploads>=1},
    {id:'collector',icon:'🎁',name:'Коллекционер',desc:'Получить 3 коллекционных подарка',test:()=>read(K.gifts,[]).length>=3},
    {id:'rich',icon:'⭐',name:'Звёздный запас',desc:'Накопить 1000 ⭐',test:()=>stars()>=1000}
  ];
  function unlockAchievements(){let p=progress(),u=read(K.ach,[]),changed=false;ACH.forEach(a=>{if(!u.includes(a.id)&&a.test(p)){u.push(a.id);changed=true;notify('Новое достижение',`${a.icon} ${a.name}`,'🏆');setXP(xp()+20)}});if(changed)write(K.ach,u);renderAchievements()}
  function renderAchievements(){const box=$('#achievementGrid');if(!box)return;const u=read(K.ach,[]),p=progress();box.innerHTML=ACH.map(a=>`<article class="achievement-card ${u.includes(a.id)?'unlocked':''}"><span>${a.icon}</span><div><b>${a.name}</b><p>${a.desc}</p></div><em>${u.includes(a.id)?'Открыто':'🔒'}</em></article>`).join('')}
  unlockAchievements();

  // ---- Notifications ----
  function renderNotifications(){const box=$('#notificationList');if(!box)return;const a=read(K.notes,[]);box.innerHTML=a.length?a.map(n=>`<article class="notification ${n.read?'read':''}" data-note="${n.id}"><span>${n.icon}</span><div><b>${n.title}</b><p>${n.text}</p><small>${new Date(n.at).toLocaleString('ru-RU')}</small></div></article>`).join(''):'<div class="empty-state">Уведомлений пока нет.</div>';}
  renderNotifications();$('#markRead')?.addEventListener('click',()=>{let a=read(K.notes,[]);a.forEach(n=>n.read=true);write(K.notes,a);renderNotifications();renderBell()});$('#clearNotifications')?.addEventListener('click',()=>{write(K.notes,[]);renderNotifications();renderBell()});

  // ---- Collectible gifts + inventory ----
  const GIFTS=[
    {id:'rose',e:'🌹',name:'Неоновая роза',rarity:'Обычный',price:70},{id:'bear',e:'🧸',name:'RNDM Мишка',rarity:'Редкий',price:150},{id:'catgift',e:'🐱',name:'Кибер-кот',rarity:'Редкий',price:180},{id:'rocket',e:'🚀',name:'Ракета',rarity:'Эпический',price:320},{id:'crown',e:'👑',name:'Корона',rarity:'Эпический',price:400},{id:'diamond',e:'💎',name:'Digital Diamond',rarity:'Легендарный',price:700},{id:'galaxy',e:'🌌',name:'Галактика',rarity:'Легендарный',price:900},{id:'phoenix',e:'🔥',name:'RNDM Phoenix',rarity:'Мифический',price:1400}
  ];
  function giftInventory(){return read(K.gifts,[])}
  function renderGiftShop(){const box=$('#collectibleShop');if(!box)return;const inv=giftInventory();box.innerHTML=GIFTS.map(g=>`<article class="collectible ${g.rarity.toLowerCase()}"><div class="gift-big">${g.e}</div><span class="rarity">${g.rarity}</span><b>${g.name}</b><small>${g.price} ⭐</small><button class="v13-btn" data-buygift="${g.id}" ${inv.includes(g.id)?'disabled':''}>${inv.includes(g.id)?'В коллекции ✓':'Купить'}</button></article>`).join('')}
  renderGiftShop();$('#collectibleShop')?.addEventListener('click',e=>{const b=e.target.closest('[data-buygift]');if(!b)return;const g=GIFTS.find(x=>x.id===b.dataset.buygift);if(!g)return;if(stars()<g.price)return toast('Недостаточно ⭐');setStars(stars()-g.price);let inv=giftInventory();if(!inv.includes(g.id))inv.push(g.id);write(K.gifts,inv);bump('gifts');bump('shopBuys');setXP(xp()+25);notify('Новый подарок в коллекции',`${g.e} ${g.name} • ${g.rarity}`,'🎁');renderGiftShop();renderV15Profile();$('#shopBalance')&&($('#shopBalance').textContent=stars())});
  function renderInventory(){const box=$('#v15Inventory');if(!box)return;const inv=giftInventory(),show=read(K.show,[]);box.innerHTML=inv.length?inv.map(id=>{const g=GIFTS.find(x=>x.id===id);if(!g)return'';return `<button class="inventory-gift ${show.includes(id)?'selected':''}" data-showgift="${id}" title="${g.name}"><span>${g.e}</span><small>${g.name}</small><em>${g.rarity}</em></button>`}).join(''):'<div class="empty-state">Подарков пока нет. Загляни в магазин ⭐.</div>'}
  $('#v15Inventory')?.addEventListener('click',e=>{const b=e.target.closest('[data-showgift]');if(!b)return;let s=read(K.show,[]),id=b.dataset.showgift;if(s.includes(id))s=s.filter(x=>x!==id);else if(s.length<3)s.push(id);else return toast('На витрине максимум 3 подарка');write(K.show,s);renderV15Profile()});
  function renderV15Profile(){if(!$('#v15ProfileStats'))return;const p=progress(),u=read(K.ach,[]),inv=giftInventory(),level=Math.floor(xp()/100)+1,show=read(K.show,[]);$('#v15ProfileStats').innerHTML=`<div><b>${level}</b><span>уровень</span></div><div><b>${xp()}</b><span>XP</span></div><div><b>${stars()}</b><span>⭐</span></div><div><b>${p.messages||0}</b><span>сообщений</span></div><div><b>${u.length}</b><span>достижений</span></div><div><b>${inv.length}</b><span>подарков</span></div>`;$('#giftShowcase').innerHTML=show.length?show.map(id=>{const g=GIFTS.find(x=>x.id===id);return g?`<span title="${g.name}">${g.e}</span>`:''}).join(''):'<small>Выбери до 3 подарков из инвентаря</small>';renderInventory();}
  renderV15Profile();

  // Bootstrap notification on first v15 visit.
  if(!localStorage.getItem('rndm-v15-welcome')){localStorage.setItem('rndm-v15-welcome','1');notify('RNDM v15 готов','Clips, задания, достижения, коллекции и новый профиль уже доступны.','🚀')}
})();

</script></body></html>
