<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#080b13"><title>Paint — RNDM Chat</title><style>
:root{--bg:#080b13;--panel:#111624;--panel2:#171e2e;--text:#f4f6ff;--muted:#9fa9c2;--line:rgba(255,255,255,.10);--violet:#7c5cff;--blue:#4d8dff;--green:#44e5a8;--red:#ff5577;--shadow:0 20px 60px rgba(0,0,0,.34)}
*{box-sizing:border-box}html{color-scheme:dark}body{margin:0;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 20% 0%,rgba(124,92,255,.16),transparent 30%),linear-gradient(180deg,#090b14,#070a11 75%);color:var(--text);min-height:100dvh}a{text-decoration:none;color:inherit}button,input,textarea,select{font:inherit}.topbar{position:sticky;top:0;z-index:1000;display:flex;align-items:center;gap:18px;padding:14px 22px;background:rgba(8,10,18,.88);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}.brand{display:flex;align-items:center;gap:10px;font-weight:850;font-size:19px;margin-right:auto}.logo{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--violet),#3eddb2);box-shadow:0 8px 30px rgba(124,92,255,.3)}.topbar nav{display:flex;gap:8px;flex-wrap:wrap}.topbar nav a{padding:9px 11px;border-radius:12px;color:var(--muted);font-weight:700;font-size:13px}.topbar nav a:hover,.topbar nav a.active{background:rgba(124,92,255,.15);color:#fff}.theme-toggle{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);background:var(--panel);color:#fff}.wrap{width:min(1180px,calc(100% - 28px));margin:0 auto;padding:30px 0 110px}.hero{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:22px}.eyebrow{color:#72efc4;font-weight:850;letter-spacing:.12em;font-size:12px}.hero h1{margin:8px 0 4px;font-size:clamp(32px,5vw,58px);line-height:1}.hero p{color:var(--muted);max-width:720px;font-size:16px}.card{background:linear-gradient(180deg,rgba(24,30,47,.92),rgba(15,20,32,.94));border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow)}.btn{border:0;border-radius:14px;padding:11px 15px;font-weight:800;cursor:pointer;color:white;background:linear-gradient(135deg,var(--violet),var(--blue));box-shadow:0 9px 26px rgba(91,100,255,.22)}.btn.secondary{background:var(--panel2);border:1px solid var(--line);box-shadow:none}.btn.green{background:linear-gradient(135deg,#17dca5,#7bf24e);color:#07110d}.btn.red{background:linear-gradient(135deg,#ff456e,#ff835a)}.field{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:15px;padding:9px 12px}.field input,.field textarea{width:100%;border:0;outline:0;background:transparent;color:var(--text);font-size:16px}.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.05);padding:7px 10px;border-radius:999px;color:var(--muted);font-size:13px}.mobile-bottom-nav,.mobile-more-sheet,.mobile-more-backdrop{display:none}.toast{position:fixed;left:50%;bottom:95px;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:11px 15px;border-radius:14px;background:#1d2434;border:1px solid var(--line);z-index:4000;transition:.2s}.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:820px){body{padding-bottom:calc(82px + env(safe-area-inset-bottom,0px))}.topbar{padding:max(10px,env(safe-area-inset-top,0px)) 14px 10px;gap:8px}.topbar nav{display:none}.brand span:last-child{font-size:17px}.wrap{width:min(100% - 20px,1180px);padding-top:20px}.hero{align-items:start;flex-direction:column}.mobile-bottom-nav{position:fixed;display:grid!important;grid-template-columns:repeat(5,1fr);left:0;right:0;bottom:0;z-index:2500;padding:7px 8px max(7px,env(safe-area-inset-bottom,0px));background:rgba(9,12,21,.94);border-top:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}.mobile-nav-item{border:0;background:transparent;color:var(--muted);min-height:57px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:14px;font-weight:750;font-size:10px}.mobile-nav-item .mi{font-size:20px}.mobile-nav-item.active{color:#fff;background:linear-gradient(135deg,rgba(124,92,255,.95),rgba(77,141,255,.85))}.mobile-more-backdrop{display:block;position:fixed;inset:0;z-index:2590;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.2s}.mobile-more-backdrop.open{opacity:1;pointer-events:auto}.mobile-more-sheet{display:block;position:fixed;left:10px;right:10px;bottom:calc(75px + env(safe-area-inset-bottom,0px));z-index:2600;background:#121726;border:1px solid var(--line);border-radius:25px;padding:12px;transform:translateY(calc(100% + 110px));opacity:0;pointer-events:none;transition:.22s;box-shadow:0 30px 90px #0008}.mobile-more-sheet.open{transform:none;opacity:1;pointer-events:auto}.mobile-more-head{display:flex;align-items:center;justify-content:space-between;padding:3px 4px 10px}.mobile-more-close{width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:#fff;font-size:20px}.mobile-more-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mobile-more-grid a{min-height:72px;border-radius:17px;background:var(--panel2);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:11px;font-weight:800}.mobile-more-grid a span{font-size:22px}.mobile-more-grid a.active{outline:2px solid #7c5cff;background:#241d4c}}

.paint-layout{display:grid;grid-template-columns:250px 1fr;gap:16px}.tools{padding:16px;display:flex;flex-direction:column;gap:14px}.tools h3{margin:0}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.swatch{aspect-ratio:1;border-radius:12px;border:2px solid #fff2;padding:0}.swatch.on{outline:3px solid #fff}.tool-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.range{width:100%}.canvas-card{padding:12px;overflow:hidden}.canvas-wrap{position:relative;background:white;border-radius:18px;overflow:hidden;min-height:570px;touch-action:none}.canvas-wrap canvas{display:block;width:100%;height:570px;touch-action:none}.paint-info{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:13px}@media(max-width:820px){.paint-layout{grid-template-columns:1fr}.tools{order:2}.canvas-card{order:1}.canvas-wrap,.canvas-wrap canvas{height:55dvh;min-height:390px}.palette{grid-template-columns:repeat(8,1fr)}}
</style></head><body><header class="topbar"><a class="brand" href="index.html"><span class="logo">R</span><span>RNDM Chat</span></a><nav><a href="index.html">Главная</a><a href="chat.html">Чаты</a><a href="videos.html" class="">Видео</a><a href="paint.html" class="active">Paint</a><a href="games.html" class="">Игры</a><a href="channels.html">Каналы</a><a href="profile.html">Профиль</a></nav><button class="theme-toggle" id="themeToggle">🌙</button></header><main class="wrap"><section class="hero"><div><span class="eyebrow">RNDM CREATIVE</span><h1>Paint 🎨</h1><p>Рисуй пальцем на iPhone или мышкой на ПК. Рисунок можно сохранить как PNG.</p></div><span class="pill">автосохранение черновика</span></section><section class="paint-layout"><aside class="card tools"><h3>Инструменты</h3><div><small>Цвет</small><div class="palette" id="palette"></div></div><div><small>Размер кисти: <b id="sizeLabel">8</b></small><input class="range" id="brushSize" type="range" min="1" max="40" value="8"></div><div class="tool-row"><button class="btn secondary" id="brush">🖌 Кисть</button><button class="btn secondary" id="eraser">🧽 Ластик</button></div><div class="tool-row"><button class="btn secondary" id="undo">↶ Назад</button><button class="btn red" id="clear">Очистить</button></div><button class="btn green" id="save">⬇️ Сохранить PNG</button><button class="btn" id="reward">⭐ Опубликовать рисунок</button><p style="color:var(--muted);font-size:13px;margin:0">За первую публикацию дня: +10 XP.</p></aside><section class="card canvas-card"><div class="canvas-wrap" id="canvasWrap"><canvas id="canvas"></canvas></div><div class="paint-info"><span id="modeLabel">Кисть • #7c5cff</span><span>Двойной тап не масштабирует холст</span></div></section></section></main><div class="toast" id="toast"></div><script>
(()=>{const current=location.pathname.split('/').pop()||'index.html';const navItems=[['index.html','⌂','Главная'],['chat.html','💬','Чаты'],['videos.html','📺','Видео'],['clips.html','▶','Clips']];const moreItems=[['contacts.html','👥','Контакты'],['friends.html','🤝','Друзья'],['channels.html','📣','Каналы'],['paint.html','🎨','Paint'],['games.html','🎮','Игры'],['cat.html','🐱','Котик'],['activity.html','🔔','Активность'],['shop.html','⭐','Магазин'],['profile.html','👤','Профиль'],['explore.html','✨','Ещё'],['about.html','ℹ️','О проекте']];const morePages=new Set(moreItems.map(x=>x[0]));function close(){sheet?.classList.remove('open');back?.classList.remove('open')}const nav=document.createElement('nav');nav.className='mobile-bottom-nav';nav.innerHTML=navItems.map(([h,i,l])=>`<a class="mobile-nav-item ${current===h?'active':''}" href="${h}"><span class="mi">${i}</span>${l}</a>`).join('')+`<button class="mobile-nav-item ${morePages.has(current)?'active':''}" id="moreBtn"><span class="mi">☰</span>Ещё</button>`;document.body.append(nav);const back=document.createElement('div');back.className='mobile-more-backdrop';document.body.append(back);const sheet=document.createElement('section');sheet.className='mobile-more-sheet';sheet.innerHTML=`<div class="mobile-more-head"><b>Разделы RNDM</b><button class="mobile-more-close">×</button></div><div class="mobile-more-grid">${moreItems.map(([h,i,l])=>`<a class="${current===h?'active':''}" href="${h}"><span>${i}</span>${l}</a>`).join('')}</div>`;document.body.append(sheet);document.querySelector('#moreBtn').onclick=()=>{sheet.classList.add('open');back.classList.add('open')};back.onclick=close;sheet.querySelector('button').onclick=close;const t=document.getElementById('themeToggle');if(t)t.onclick=()=>document.body.classList.toggle('light')})();

const toast=(m)=>{const t=document.querySelector('#toast');t.textContent=m;t.classList.add('on');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('on'),1800)};

const c=document.querySelector('#canvas'),ctx=c.getContext('2d'),wrap=document.querySelector('#canvasWrap');let drawing=false,color='#7c5cff',size=8,erase=false,last=null,history=[];const colors=['#111827','#ffffff','#7c5cff','#4d8dff','#44e5a8','#ffd84d','#ff9a4d','#ff5577','#ff4be1','#7f8ca8'];const pal=document.querySelector('#palette');colors.forEach((x,i)=>{const b=document.createElement('button');b.className='swatch'+(i===2?' on':'');b.style.background=x;b.onclick=()=>{color=x;erase=false;document.querySelectorAll('.swatch').forEach(z=>z.classList.remove('on'));b.classList.add('on');update()};pal.append(b)});function resize(){const dpr=Math.min(devicePixelRatio||1,2),w=wrap.clientWidth,h=wrap.clientHeight;let snap=null;if(c.width&&c.height){snap=document.createElement('canvas');snap.width=c.width;snap.height=c.height;snap.getContext('2d').drawImage(c,0,0)}c.width=w*dpr;c.height=h*dpr;c.style.width=w+'px';c.style.height=h+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);if(snap)ctx.drawImage(snap,0,0,snap.width,snap.height,0,0,w,h)}resize();addEventListener('resize',()=>setTimeout(resize,80));function pt(e){const r=c.getBoundingClientRect(),t=e.touches?.[0]||e;return{x:t.clientX-r.left,y:t.clientY-r.top}}function snapshot(){if(history.length>15)history.shift();history.push(c.toDataURL())}function start(e){e.preventDefault();snapshot();drawing=true;last=pt(e)}function move(e){if(!drawing)return;e.preventDefault();const p=pt(e);ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.lineCap='round';ctx.lineJoin='round';ctx.lineWidth=size;ctx.strokeStyle=erase?'#fff':color;ctx.stroke();last=p}function end(){drawing=false;last=null;try{localStorage.setItem('rndm-paint-draft',c.toDataURL('image/png',.7))}catch{}}c.addEventListener('pointerdown',start);c.addEventListener('pointermove',move);addEventListener('pointerup',end);document.querySelector('#brushSize').oninput=e=>{size=+e.target.value;document.querySelector('#sizeLabel').textContent=size};document.querySelector('#eraser').onclick=()=>{erase=true;update()};document.querySelector('#brush').onclick=()=>{erase=false;update()};function update(){document.querySelector('#modeLabel').textContent=(erase?'Ластик':'Кисть')+' • '+(erase?'белый':color)}document.querySelector('#clear').onclick=()=>{snapshot();ctx.fillStyle='#fff';ctx.fillRect(0,0,c.clientWidth,c.clientHeight)};document.querySelector('#undo').onclick=()=>{const u=history.pop();if(!u)return;const im=new Image();im.onload=()=>{ctx.fillStyle='#fff';ctx.fillRect(0,0,c.clientWidth,c.clientHeight);ctx.drawImage(im,0,0,c.clientWidth,c.clientHeight)};im.src=u};document.querySelector('#save').onclick=()=>{const a=document.createElement('a');a.download='RNDM_Paint_'+Date.now()+'.png';a.href=c.toDataURL('image/png');a.click();toast('Рисунок сохранён')};document.querySelector('#reward').onclick=()=>{const day=new Date().toISOString().slice(0,10),k='rndm-paint-reward-'+day;if(localStorage.getItem(k))return toast('Награда за сегодня уже получена');localStorage.setItem(k,'1');let xp=+(localStorage.getItem('rndm-xp-v1')||0)+10;localStorage.setItem('rndm-xp-v1',xp);localStorage.setItem('rndm-xp-v13',xp);toast('+10 XP за рисунок 🎨')};const draft=localStorage.getItem('rndm-paint-draft');if(draft){const im=new Image();im.onload=()=>ctx.drawImage(im,0,0,c.clientWidth,c.clientHeight);im.src=draft}update();
</script></body></html>
